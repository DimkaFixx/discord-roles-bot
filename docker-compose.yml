services:
  discord-bot:
    build: .
    container_name: discord_role_bot
    restart: unless-stopped
    network_mode: "host"
    env_file:
      - .env
    volumes:
      - role_data:/app/data
      # Ключ сервисного аккаунта Google (исключён из образа через .dockerignore)
      - ./.creditials.json:/app/.creditials.json:ro

volumes:
  role_data:
